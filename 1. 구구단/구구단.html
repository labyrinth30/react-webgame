<html>

<head>
    <title>구구단</title>
    <meta charset="utf-8">
</head>

<body>
    <div id="root"></div>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script type="text/babel">
        'use strict';

        class Gugudan extends React.Component {
            constructor(props) {
                super(props);
                this.state = {
                    firstNumber: Math.ceil(Math.random() * 9),
                    secondNumber: Math.ceil(Math.random() * 9),
                    valueNumber: '',
                    result: '정답을 맞춰보시죠',
                }
            }
            onSubmit = (e) => {
                e.preventDefault();
                if (this.state.firstNumber * this.state.secondNumber === Number(this.state.valueNumber)) {
                    this.setState({
                        result: `${this.state.valueNumber} 정답`,
                        valueNumber: '',
                        firstNumber: Math.ceil(Math.random() * 9),
                        secondNumber: Math.ceil(Math.random() * 9),
                    });
                } else {
                    this.setState({
                        result: `${this.state.valueNumber} 땡`,
                        valueNumber: '',
                    });
                }
            }
            onChange = (e) => {
                this.setState({
                    valueNumber: e.target.value,
                });
            }
            render() {
                return (
                    <div>
                        <div>{this.state.firstNumber} 곱하기 {this.state.secondNumber}는?</div>
                        <form onSubmit={this.onSubmit}>
                            <input type="number" value={this.state.valueNumber} onChange={this.onChange} />
                            <button> 입력 </button>
                            <div>{this.state.result}</div>
                        </form>
                    </div>
                );
            }
        }

    </script>
    <script type="text/babel">
        ReactDOM.render(<Gugudan />, document.querySelector('#root'));
    </script>
</body>

</html>
